---
name: Integration test (foremanctl)

on:
  workflow_dispatch:
    inputs:
      foremanctl_ref:
        description: 'foremanctl branch or tag to test against'
        required: false
        default: 'master'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE_TAG: nightly

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        box:
          - centos/stream9
          - centos/stream10
    runs-on: ubuntu-24.04
    env:
      FOREMANCTL_BASE_BOX: ${{ matrix.box }}
    name: ${{ matrix.box }}
    steps:
      - name: generate artifact suffix
        run: echo "ARTIFACT_SUFFIX=$(echo '${{ matrix.box }}' | tr -cd '[:alnum:]-')" >> "${GITHUB_ENV}"

      - name: Checkout foreman-oci-images
        uses: actions/checkout@v7

      - name: Build foreman image
        run: make build PROJECT=foreman FOREMAN_XY_TAG=${{ env.IMAGE_TAG }}

      - name: Build foreman-proxy image
        run: make build PROJECT=foreman-proxy FOREMAN_XY_TAG=${{ env.IMAGE_TAG }}

      - name: Verify static UID/GID
        run: |
          verify() {
            local image=$1 user=$2 expected=$3
            uid=$(podman run --rm "$image" id -u "$user")
            gid=$(podman run --rm "$image" id -g "$user")
            echo "$user uid=$uid gid=$gid"
            [ "$uid" = "$expected" ] && [ "$gid" = "$expected" ]
          }
          verify quay.io/foreman/foreman:nightly foreman 994
          verify quay.io/foreman/foreman-proxy:nightly foreman-proxy 991

      - name: Export images as tarballs
        run: |
          podman save -o foreman-image.tar quay.io/foreman/foreman:${{ env.IMAGE_TAG }}
          podman save -o foreman-proxy-image.tar quay.io/foreman/foreman-proxy:${{ env.IMAGE_TAG }}

      - name: Checkout foremanctl
        uses: actions/checkout@v7
        with:
          repository: theforeman/foremanctl
          ref: ${{ github.event.inputs.foremanctl_ref || 'master' }}
          path: foremanctl

      - name: Prepare images for VM transfer
        run: |
          mv foreman-image.tar foremanctl/
          mv foreman-proxy-image.tar foremanctl/

      - name: Set container_tag_stream to ${{ env.IMAGE_TAG }}
        run: |
          sed -i '/container_tag_stream:/ s/:.*/: "${{ env.IMAGE_TAG }}"/' foremanctl/src/vars/images.yml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup libvirt for Vagrant
        uses: voxpupuli/setup-vagrant@v0
        with:
          configure_dns: true

      - name: Install Ansible
        run: pip install --upgrade ansible-core

      - name: Setup environment
        working-directory: foremanctl
        run: ./setup-environment

      - name: Start VM
        working-directory: foremanctl
        run: ./forge vms start --vms "quadlet client"

      - name: Install podman in VM
        working-directory: foremanctl
        run: vagrant ssh quadlet -- sudo dnf install -y podman

      - name: Pull images
        working-directory: foremanctl
        run: ./foremanctl pull-images

      - name: Load images into VM
        working-directory: foremanctl
        run: |
          vagrant ssh quadlet -- sudo podman load -i /vagrant/foreman-image.tar
          vagrant ssh quadlet -- sudo podman load -i /vagrant/foreman-proxy-image.tar

      - name: Free disk space
        run: |
          rm -f foremanctl/foreman-image.tar foremanctl/foreman-proxy-image.tar
          podman system prune --all --force

      - name: Configure repositories
        working-directory: foremanctl
        run: ./forge setup-repositories

      - name: Run deployment
        working-directory: foremanctl
        run: |
          ./foremanctl deploy \
            --initial-admin-password=changeme \
            --initial-organization "Foreman CI" \
            --initial-location "Internet" \
            --tuning development \
            --add-feature hammer \
            --add-feature foreman-proxy \
            --add-feature remote-execution

      - name: Run tests
        working-directory: foremanctl
        run: |
          ./forge test --pytest-args="tests/foreman_target_test.py tests/feature/foreman/base_test.py tests/feature/foreman-proxy/base_test.py tests/feature/katello tests/valkey_test.py tests/postgresql_test.py tests/httpd_test.py tests/feature/hammer/base_test.py"

      - name: Generate sos reports
        if: ${{ always() }}
        working-directory: foremanctl
        run: ./forge sos

      - name: Archive sos reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sosreport-${{ env.ARTIFACT_SUFFIX }}
          path: foremanctl/sos/
